<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2026"/>
      <stop offset="1" stop-color="#0F0F11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#4ADDFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4ADDFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect width="1024" height="1024" rx="232"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <!-- hairline inner ring (glass edge) -->
    <rect x="14" y="14" width="996" height="996" rx="220" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="8"/>
    <!-- the options: two quiet bars -->
    <rect x="232" y="300" width="230" height="64" rx="32" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="232" y="660" width="230" height="64" rx="32" fill="#ffffff" fill-opacity="0.22"/>
    <!-- the pick: one bar lifted, drawn in the accent, with the check growing out of it -->
    <path d="M232 512 H470" stroke="#4ADDFF" stroke-width="64" stroke-linecap="round" filter="url(#soft)" opacity="0.55"/>
    <path d="M232 512 H470" stroke="#4ADDFF" stroke-width="64" stroke-linecap="round"/>
    <path d="M560 512 L660 612 L830 400" fill="none" stroke="#4ADDFF" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.45"/>
    <path d="M560 512 L660 612 L830 400" fill="none" stroke="#FFFFFF" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
