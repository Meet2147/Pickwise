name: Pickwise
options:
  bundleIdPrefix: com.meetjethwa
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "7"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    DEVELOPMENT_TEAM: C9NLF34677
targets:
  PickwiseMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
      - path: Pickwise/Models
      - path: Pickwise/Services/AppError.swift
      - path: Pickwise/Services/KeychainStore.swift
      - path: Pickwise/Services/HistoryStore.swift
      - path: Pickwise/Services/PickwiseAPI.swift
    info:
      path: iOS/Info.plist
      properties:
        CFBundleName: Pickwise
        CFBundleDisplayName: Pickwise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetjethwa.Pickwise.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  Pickwise:
    type: application
    platform: macOS
    sources:
      - path: Pickwise
        excludes: ["Resources/Info.plist"]
    info:
      path: Pickwise/Resources/Info.plist
      properties:
        CFBundleName: Pickwise
        CFBundleDisplayName: Pickwise
        CFBundleIdentifier: com.meetjethwa.Pickwise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Meet Jethwa"
        NSScreenCaptureUsageDescription: "Pickwise captures a region of your screen so you can add a product you're looking at to a comparison. Captures never leave your Mac except as part of the comparison you send to the AI."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Pickwise/Pickwise.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.cs.allow-unsigned-executable-memory: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetjethwa.Pickwise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  Pickwise:
    build:
      targets: { Pickwise: all }
    run:
      config: Debug
    archive:
      config: Release
  PickwiseMobile:
    build:
      targets: { PickwiseMobile: all }
    run:
      config: Debug
    archive:
      config: Release
