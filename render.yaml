# Render Blueprint — static site served from Site/
services:
  - type: web
    name: pickwise
    runtime: static
    staticPublishPath: Site
    buildCommand: ""
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https://productwatch.io; media-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://pickwise-api-3jv9.onrender.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /downloads/*
        name: Content-Disposition
        value: attachment
      - path: /version.json
        name: Cache-Control
        value: no-cache

  # Pickwise API — holds the Anthropic key, meters usage, validates Polar subscriptions.
  - type: web
    name: pickwise-api
    runtime: node
    rootDir: Server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # set in the Render dashboard — never in the repo
      - key: POLAR_ORG_ID
        sync: false
      - key: FREE_LIMIT
        value: "3"
      - key: MONTHLY_LIMIT
        value: "30"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pickwise-kv
          property: connectionString

  - type: keyvalue
    name: pickwise-kv
    plan: free
    ipAllowList: []            # internal access only
